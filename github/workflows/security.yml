name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC to catch newly disclosed CVEs
    - cron: '0 8 * * 1'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high

  lint-and-security:
    name: ESLint + Security Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run ESLint with security plugin
        run: npx eslint . --ext .js,.jsx,.ts,.tsx --max-warnings=0

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so TruffleHog can scan all commits

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  headers-check:
    name: Security Headers Check
    runs-on: ubuntu-latest
    # Only runs on push to main where a live URL is available
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Check security headers on live site
        run: |
          SITE_URL="${{ secrets.SITE_URL }}"
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret not set — skipping header check"
            exit 0
          fi
          # Verify key security headers are present
          HEADERS=$(curl -sI "$SITE_URL")
          echo "$HEADERS"
          echo "$HEADERS" | grep -i "x-frame-options" || (echo "MISSING: X-Frame-Options" && exit 1)
          echo "$HEADERS" | grep -i "x-content-type-options" || (echo "MISSING: X-Content-Type-Options" && exit 1)
          echo "$HEADERS" | grep -i "content-security-policy" || (echo "MISSING: Content-Security-Policy" && exit 1)
